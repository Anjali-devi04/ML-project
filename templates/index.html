<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Performance Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>🎓 Student Performance Predictor</h1>

    <form action="/predict" method="POST">

        <div class="grid">

            <div class="input-box">
                <label>Age</label>
                <input type="number" name="age" min="15" max="22" required>
            </div>

            <div class="input-box">
                <label>Gender</label>

                <select name="sex">
                    <option value="0">Female</option>
                    <option value="1">Male</option>
                </select>

            </div>

            <div class="input-box">
                <label>Family Size</label>

                <select name="famsize">
                    <option value="0">3 or Less</option>
                    <option value="1">Greater than 3</option>
                </select>

            </div>

            <div class="input-box">
                <label>Mother Education</label>

                <select name="Medu">
                    <option value="0">Primary</option>
                    <option value="1">Middle School</option>
                    <option value="2">High School</option>
                    <option value="3">College</option>
                    <option value="4">Graduate</option>
                </select>

            </div>

            <div class="input-box">
                <label>Father Education</label>

                <select name="Fedu">
                    <option value="0">Primary</option>
                    <option value="1">Middle School</option>
                    <option value="2">High School</option>
                    <option value="3">College</option>
                    <option value="4">Graduate</option>
                </select>

            </div>

            <div class="input-box">
                <label>Travel Time</label>

                <select name="traveltime">
                    <option value="1">Less than 15 min</option>
                    <option value="2">15 - 30 min</option>
                    <option value="3">30 min - 1 hr</option>
                    <option value="4">More than 1 hr</option>
                </select>

            </div>

            <div class="input-box">
                <label>Study Time</label>

                <select name="studytime">
                    <option value="1">Less than 2 hrs/week</option>
                    <option value="2">2 - 5 hrs/week</option>
                    <option value="3">5 - 10 hrs/week</option>
                    <option value="4">More than 10 hrs/week</option>
                </select>

            </div>

            <div class="input-box">
                <label>Previous Failures</label>

                <select name="failures">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3 or More</option>
                </select>

            </div>

            <div class="input-box">
                <label>School Support</label>

                <select name="schoolsup">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>

            </div>

            <div class="input-box">
                <label>Family Support</label>

                <select name="famsup">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>

            </div>

            <div class="input-box">
                <label>Internet Access</label>

                <select name="internet">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>

            </div>

            <div class="input-box">
                <label>Family Relationship</label>

                <input type="range"
                       min="1"
                       max="5"
                       value="3"
                       name="famrel">

            </div>

            <div class="input-box">
                <label>Going Out</label>

                <input type="range"
                       min="1"
                       max="5"
                       value="3"
                       name="goout">

            </div>

            <div class="input-box">
                <label>Health</label>

                <input type="range"
                       min="1"
                       max="5"
                       value="3"
                       name="health">

            </div>

            <div class="input-box">
                <label>Absences</label>

                <input type="number"
                       name="absences"
                       min="0"
                       max="90"
                       required>

            </div>

        </div>

        <button type="submit">
            Predict Performance
        </button>

    </form>

    {% if prediction %}

    <div class="result">

        <h2>Prediction Result</h2>

        <h1>{{ prediction }} / 20</h1>

        <h3>{{ level }}</h3>

        <hr>

        <h3>Recommendations</h3>

        <ul>

            {% for item in suggestions %}

                <li>{{ item }}</li>

            {% endfor %}

        </ul>

    </div>

    {% endif %}

</div>

</body>

</html>
